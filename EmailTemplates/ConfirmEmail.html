<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif;">
    <h2>Hi {{UserName}}.</h2>
    <p>Thanks for registering an account for Nio Jass. Click below to confirm your email:</p>
    <p>
        <a href="{{ConfirmLink}}"
           style="
               display: inline-block;
               padding: 10px 14px;
               background-color: #444;
               border: 1px solid #000;
               border-radius: 6px;
               color: #fff;
               font-family: Arial, sans-serif;
               font-size: 16px;
               font-weight: 600;
               line-height: 20px;
               text-align: center;
               text-decoration: none;">
            Confirm Email
        </a>
    </p>
    <p>If you didn’t sign up, you can ignore this email.</p>
</body>
</html>
