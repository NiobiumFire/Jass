<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif;">
    <h2>Hi {{UserName}}.</h2>
    <p>You informed us that you have changed your email address for you Nio Jass account. Click below to confirm your new email:</p>
    <p>
        <a href="{{ConfirmLink}}"
           style="               
               display: inline-block;
               padding: 10px 14px;
               background-color: #444;
               border: 1px solid #000;
               border-radius: 6px;
               color: #fff;
               font-family: Arial, sans-serif;
               font-size: 16px;
               font-weight: 600;
               line-height: 20px;
               text-align: center;
               text-decoration: none;">
            Confirm Email
        </a>
    </p>
    <p>If you didn’t request this change, you can ignore this email.</p>
</body>
</html>
